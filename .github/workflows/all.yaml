name: Build & deploy

on:
  push:
  workflow_dispatch:

jobs:
  rust-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform:
          - target: x86_64-unknown-linux-musl
            exec: storm
            name: linux
          - target: x86_64-pc-windows-gnu
            exec: storm.exe
            name: windows
          - target: universal2-apple-darwin
            exec: storm
            name: macos
    steps:
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          targets: x86_64-unknown-linux-musl,x86_64-pc-windows-gnu,x86_64-apple-darwin,aarch64-apple-darwin
      - uses: mlugg/setup-zig@v2
      - run: cargo install --locked cargo-zigbuild
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ matrix.platform.name }}-${{ hashFiles('**/Cargo.lock') }}
      - run: CFLAGS="-D_GNU_SOURCE" cargo zigbuild --target ${{ matrix.platform.target }} --profile=release
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.platform.name }}
          path: target/${{ matrix.platform.target }}/release/${{ matrix.platform.exec }}
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}-test
      - run: cargo test
  site-build:
    needs:
      - rust-build
    runs-on: ubuntu-latest
    steps:
      - name: Determine base
        id: branch-name
        run: echo base=${{ github.ref_name }} | sed 's|base=\([0-9]*\)/merge|base=pr-\1|' | sed 's|base=release/\(.*\)|base=v\1|' >> $GITHUB_OUTPUT
      - name: Install sphinx
        run: |
          pip install furo sphinxcontrib-katex myst-parser
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          name: binary-linux
          path: .
      - name: Generate CLI reference
        run: chmod +x storm && echo "generate-markdown ./docs/source/reference.md" | ./storm
      - name: Build
        run: |
          cd docs && sphinx-build -M dirhtml source build
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: ./docs/build/dirhtml
    outputs:
      url-base: ${{ steps.branch-name.outputs.base }}
  deploy:
    needs:
      - site-build
      - rust-build
      - rust-test
    environment:
      name: stellar-oscillations.org
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v5
        with:
          name: site
          path: ${{ needs.site-build.outputs.url-base }}
      - uses: actions/download-artifact@v5
        with:
          name: binary-linux
          path: ${{ needs.site-build.outputs.url-base }}/installation/linux/
      - uses: actions/download-artifact@v5
        with:
          name: binary-windows
          path: ${{ needs.site-build.outputs.url-base }}/installation/windows/
      - uses: actions/download-artifact@v5
        with:
          name: binary-macos
          path: ${{ needs.site-build.outputs.url-base }}/installation/macos/
      - name: Make source archive
        run: git archive HEAD --format=tar.gz > ${{ needs.site-build.outputs.url-base }}/installation/storm.tar.gz
      - name: Set SSH key
        run: echo "$SSH_KEY" > key && chmod 600 key
        env:
          SSH_KEY: ${{secrets.MAIN_SITE_KEY}}
      - name: Set known hosts
        run: mkdir -p ~/.ssh/ && echo "stellar-oscillations.org ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAILClmFHy/1PILQqrfQftA4n3Qgjv+/UnGhno1hp65Q03" >> ~/.ssh/known_hosts
      - name: Copy files
        run: rsync -e "ssh -i key" --delete-after -cvrl ${{ needs.site-build.outputs.url-base }} oscillations@stellar-oscillations.org:storm/docs
